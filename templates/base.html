<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Access Gate</title><link rel="stylesheet" href="/static/gate.css"><script src="/static/gate.js" defer></script></head>
<body><main><a class="brand" href="/">ACCESS GATE</a>{% if session.get('admin') %}<nav aria-label="Administration"><a href="{{ url_for('admin') }}">Overview</a><a href="{{ url_for('batches') }}">Batches</a><a href="{{ url_for('new_batch') }}">Create batch</a><a href="{{ url_for('dns_domains') }}">DNS domains</a><a href="{{ url_for('active_sessions') }}">Sessions</a><a href="{{ url_for('system_status') }}">System status</a><a href="{{ url_for('admin_settings') }}">Settings</a><form method="post" action="{{ url_for('logout') }}"><input type="hidden" name="csrf" value="{{ session.get('csrf','') }}"><button class="secondary">Sign out</button></form></nav>{% endif %}
{% for category,message in get_flashed_messages(with_categories=true) %}<p class="notice {{ category }}" role="status">{{ message }}</p>{% endfor %}{% block content %}{% endblock %}</main></body></html>
